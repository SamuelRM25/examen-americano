<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen en curso · Colegio Americano</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/exam.css">
</head>
<body>
<div class="container">
  <div id="exam-header" class="exam-header hidden">
    <div class="exam-info">
      <h2 id="exam-title">Cargando…</h2>
      <div class="student" id="exam-student"></div>
    </div>
    <div class="timer" id="timer">30:00</div>
  </div>

  <div id="progress" class="progress-dots hidden"></div>

  <div id="question-container"></div>

  <div id="nav-buttons" class="nav-buttons hidden">
    <button class="btn btn-secondary" id="btn-prev">← Anterior</button>
    <button class="btn btn-secondary" id="btn-next">Siguiente →</button>
    <button class="btn btn-danger" id="btn-finish">Finalizar examen</button>
  </div>
</div>

<script src="js/codes.js"></script>
<script src="js/exam-primero_basico.js"></script>
<script src="js/exam-segundo_basico.js"></script>
<script src="js/exam-tercero_basico.js"></script>
<script src="js/exam-cuarto_madurez.js"></script>
<script src="js/exam-cuarto_perito.js"></script>
<script src="js/exam-quinto_perito.js"></script>
<script src="js/exam-sexto_pc.js"></script>
<script src="js/exam-cuarto_secretariado.js"></script>
<script src="js/exam-quinto_bachillerato.js"></script>
<script src="js/exam-test_rapido.js"></script>
<script src="js/exam-engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
